AWSTemplateFormatVersion: '2010-09-09'
Description: >
  KubeCostFinOps Least-Cost AWS EKS Production Infrastructure Template.
  Provisions an optimized VPC, EKS cluster, managed worker node group, and ECR repository
  designed specifically to eliminate NAT Gateway charges ($32.40/mo savings).

Parameters:
  ClusterName:
    Type: String
    Default: kubecost-finops-eks
    Description: Name of the EKS Cluster
  KubernetesVersion:
    Type: String
    Default: "1.30"
    Description: Kubernetes version for EKS
  NodeInstanceType:
    Type: String
    Default: t3.medium
    Description: EC2 instance type for worker nodes (2 vCPU, 4 GiB RAM)
  NodeCapacityType:
    Type: String
    Default: ON_DEMAND
    AllowedValues:
      - ON_DEMAND
      - SPOT
    Description: Node group capacity type (SPOT reduces EC2 cost by ~70%)

Resources:
  # ============================================================================
  # 1. NETWORKING (Zero-NAT Gateway Architecture to Minimize Costs)
  # ============================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.100.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-vpc"
        - Key: !Sub "kubernetes.io/cluster/${ClusterName}"
          Value: shared

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-igw"

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  RouteTablePublic:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-public-rt"

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTablePublic
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetPublicA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.100.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-subnet-public-a"
        - Key: !Sub "kubernetes.io/cluster/${ClusterName}"
          Value: shared
        - Key: kubernetes.io/role/elb
          Value: 1

  SubnetPublicB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.100.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-subnet-public-b"
        - Key: !Sub "kubernetes.io/cluster/${ClusterName}"
          Value: shared
        - Key: kubernetes.io/role/elb
          Value: 1

  SubnetRouteTableAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetPublicA
      RouteTableId: !Ref RouteTablePublic

  SubnetRouteTableAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetPublicB
      RouteTableId: !Ref RouteTablePublic

  # ============================================================================
  # 2. SECURITY GROUPS
  # ============================================================================
  ClusterControlPlaneSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EKS Control Plane Communication Security Group
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-controlplane-sg"

  # ============================================================================
  # 3. IAM ROLES (Least Privilege for EKS & Node Group)
  # ============================================================================
  EKSClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-cluster-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  EKSNodeInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-nodegroup-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly

  # ============================================================================
  # 4. EKS CLUSTER CONTROL PLANE
  # ============================================================================
  EKSCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt EKSClusterRole.Arn
      ResourcesVpcConfig:
        SecurityGroupIds:
          - !Ref ClusterControlPlaneSecurityGroup
        SubnetIds:
          - !Ref SubnetPublicA
          - !Ref SubnetPublicB
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
      Tags:
        - Key: Project
          Value: KubeCostFinOps
        - Key: Course
          Value: BCSE355L

  # ============================================================================
  # 5. MANAGED NODE GROUP (Single Node or 1-2 Scaled Nodes)
  # ============================================================================
  EKSNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref ClusterName
      NodegroupName: !Sub "${ClusterName}-managed-nodes"
      NodeRole: !GetAtt EKSNodeInstanceRole.Arn
      Subnets:
        - !Ref SubnetPublicA
        - !Ref SubnetPublicB
      InstanceTypes:
        - !Ref NodeInstanceType
      CapacityType: !Ref NodeCapacityType
      ScalingConfig:
        MinSize: 1
        DesiredSize: 1
        MaxSize: 2
      DiskSize: 20
      Tags:
        Project: KubeCostFinOps
        Course: BCSE355L

  # ============================================================================
  # 6. ECR REPOSITORY (For Versioned Container Images)
  # ============================================================================
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: kubecost-finops-platform
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Retain only latest 5 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: KubeCostFinOps

Outputs:
  ClusterNameOutput:
    Description: EKS Cluster Name
    Value: !Ref EKSCluster
  ClusterEndpoint:
    Description: EKS API Server Endpoint
    Value: !GetAtt EKSCluster.Endpoint
  ClusterArn:
    Description: EKS Cluster ARN
    Value: !GetAtt EKSCluster.Arn
  ECRRepoUri:
    Description: Amazon ECR Repository URI
    Value: !GetAtt ECRRepository.RepositoryUri
  VPCId:
    Description: Provisioned VPC ID
    Value: !Ref VPC
