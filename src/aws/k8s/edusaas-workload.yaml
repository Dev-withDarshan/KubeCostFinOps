# ==============================================================================
# Monitored SaaS Educational Workload Deployment on AWS EKS
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edusaas-backend
  namespace: edusaas
  labels:
    app: edusaas-backend
    app.kubernetes.io/part-of: kubecost-finops
    project: kubecost-finops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edusaas-backend
  template:
    metadata:
      labels:
        app: edusaas-backend
        app.kubernetes.io/part-of: kubecost-finops
        project: kubecost-finops
    spec:
      containers:
        - name: backend
          image: public.ecr.aws/docker/library/hashicorp-http-echo:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-listen=:8080"
            - "-text=EduSaaS LMS API Backend Running on AWS EKS"
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: edusaas-backend-svc
  namespace: edusaas
  labels:
    app: edusaas-backend
spec:
  type: ClusterIP
  selector:
    app: edusaas-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
