# ==============================================================================
# FinOps Intelligence Platform Deployment on AWS EKS
# Runs the Python REST API and Interactive Dashboard
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finops-platform-sa
  namespace: finops-system
  labels:
    app: finops-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: finops-metrics-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: finops-metrics-reader-binding
subjects:
  - kind: ServiceAccount
    name: finops-platform-sa
    namespace: finops-system
roleRef:
  kind: ClusterRole
  name: finops-metrics-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-platform
  namespace: finops-system
  labels:
    app: finops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finops-platform
  template:
    metadata:
      labels:
        app: finops-platform
    spec:
      serviceAccountName: finops-platform-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: finops-api-dashboard
          # Replaced during deployment with ECR repository URI: <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/kubecost-finops-platform:v1.0.0
          image: kubecost-finops-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: finops-platform-svc
  namespace: finops-system
  labels:
    app: finops-platform
spec:
  type: ClusterIP
  selector:
    app: finops-platform
  ports:
    - name: http
      port: 8000
      targetPort: 8000
