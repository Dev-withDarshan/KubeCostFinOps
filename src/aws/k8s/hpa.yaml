# ==============================================================================
# HorizontalPodAutoscaler Specification for AWS EKS
# Scales replicas between 2 and 6 based on 70% CPU target utilization
# ==============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edusaas-backend-hpa
  namespace: edusaas
  labels:
    app: edusaas-backend
    project: kubecost-finops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edusaas-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
