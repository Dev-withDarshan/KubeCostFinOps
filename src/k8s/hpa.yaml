# hpa.yaml — Horizontal Pod Autoscaler manifest
# Automatically scales edusaas-backend based on CPU utilisation
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edusaas-backend-hpa
  namespace: default
  labels:
    app: edusaas-backend
    project: kubecost-finops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edusaas-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
