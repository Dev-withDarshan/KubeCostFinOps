# ingress.yaml — Kubernetes Ingress manifest
# Routes external HTTP traffic to the edusaas-backend Service in edusaas namespace
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edusaas-ingress
  namespace: edusaas
  labels:
    app: edusaas-backend
    app.kubernetes.io/part-of: kubecost-finops
    project: kubecost-finops
  annotations:
    kubernetes.io/ingress.class: "alb"                         # AWS ALB Ingress Controller (or ingress-nginx in Kind)
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
spec:
  rules:
    - host: edusaas.example.com   # Replace with domain or use cluster ingress / port-forward
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edusaas-backend-svc
                port:
                  number: 80
