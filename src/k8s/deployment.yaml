# deployment.yaml — Kubernetes Deployment manifest for educational SaaS workload
# Deploys the educational SaaS platform backend in the isolated edusaas namespace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edusaas-backend
  namespace: edusaas
  labels:
    app: edusaas-backend
    app.kubernetes.io/part-of: kubecost-finops
    project: kubecost-finops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edusaas-backend
  template:
    metadata:
      labels:
        app: edusaas-backend
        app.kubernetes.io/part-of: kubecost-finops
        project: kubecost-finops
      annotations:
        # Set to false for mock container (http-echo has no /metrics format); toggle to true when real backend is deployed
        prometheus.io/scrape: "false"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          # For local Kind/Minikube testing: use public image (e.g. hashicorp/http-echo or kennethreitz/httpbin)
          # For AWS EKS production: replace with <AWS_ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/edusaas-backend:latest
          image: hashicorp/http-echo:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-listen=:8080"
            - "-text=EduSaaS LMS API Backend Service Online"
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: APP_NAME
              value: "edusaas-backend"
