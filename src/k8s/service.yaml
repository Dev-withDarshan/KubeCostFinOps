# service.yaml — Kubernetes Service manifest
# Exposes the edusaas-backend Deployment within the edusaas namespace
apiVersion: v1
kind: Service
metadata:
  name: edusaas-backend-svc
  namespace: edusaas
  labels:
    app: edusaas-backend
    app.kubernetes.io/part-of: kubecost-finops
    project: kubecost-finops
spec:
  type: ClusterIP
  selector:
    app: edusaas-backend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
